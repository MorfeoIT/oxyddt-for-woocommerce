name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: WordPress coding standards
        run: composer lint

      - name: PHPStan, level 8
        run: composer analyse

  unit:
    name: Unit tests, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      # No database, no WordPress, no WooCommerce: the Domain layer is plain PHP
      # on purpose, and this is what that buys.
      - name: PHPUnit, unit suite
        run: composer test

  wordpress:
    name: Integration, PHP ${{ matrix.php }}, orders in ${{ matrix.storage }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
        # The plugin is supposed not to care where WooCommerce keeps its orders.
        # The only way to be sure is to run the whole suite both ways.
        storage: ['posts', 'hpos']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oxyddt_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, zip
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Build the WordPress and WooCommerce test environment
        id: wp
        env:
          WP_DB_NAME: oxyddt_tests
          WP_DB_USER: root
          WP_DB_PASSWORD: root
          WP_DB_HOST: 127.0.0.1
        run: |
          # Called through bash on purpose: the repository is worked on from
          # Windows, where git cannot record an executable bit of its own.
          bash scripts/wordpress-test-env.sh >env.txt
          echo "config=$(sed -n 1p env.txt)" >>"$GITHUB_OUTPUT"
          echo "woocommerce=$(sed -n 2p env.txt)" >>"$GITHUB_OUTPUT"

      - name: PHPUnit, integration suite
        env:
          WP_PHPUNIT__TESTS_CONFIG: ${{ steps.wp.outputs.config }}
          WP_WOOCOMMERCE_DIR: ${{ steps.wp.outputs.woocommerce }}
          WP_WOOCOMMERCE_HPOS: ${{ matrix.storage == 'hpos' && '1' || '' }}
        run: composer test:integration

  concurrency:
    name: Two people pressing Issue at once
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oxyddt_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
          tools: composer:v2

      # Twelve processes taking three hundred numbers from one counter, all
      # starting at the same instant, running the same SQL the plugin runs. The
      # integration suite cannot do this: it is one process, inside a
      # transaction.
      - name: Take three hundred numbers from twelve processes
        env:
          WP_DB_NAME: oxyddt_tests
          WP_DB_USER: root
          WP_DB_PASSWORD: root
          WP_DB_HOST: 127.0.0.1
        run: php scripts/concurrency-check.php 12 25

  package:
    name: Distributable package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, dom, gd
          coverage: none
          tools: composer:v2

      # What ships is what `git archive` produces plus the libraries the plugin
      # bundles, installed without anything from require-dev. .gitattributes is
      # easy to forget when a directory is added, and the reviewers are not.
      - name: Build it the way the release does
        run: |
          mkdir -p build
          git archive --format=tar --prefix=oxyddt-for-woocommerce/ HEAD | tar -x -C build
          composer install --no-dev --optimize-autoloader --no-interaction \
            --working-dir=build/oxyddt-for-woocommerce

      - name: Nothing that belongs to development may be in it
        run: |
          status=0
          for unwanted in tests scripts docs .github phpunit.xml.dist phpcs.xml.dist phpstan.neon.dist README.md; do
            if [ -e "build/oxyddt-for-woocommerce/${unwanted}" ]; then
              echo "::error::${unwanted} would be shipped to users."
              status=1
            fi
          done

          for dev in vendor/phpunit vendor/squizlabs vendor/phpstan vendor/wp-phpunit vendor/yoast vendor/php-stubs; do
            if [ -e "build/oxyddt-for-woocommerce/${dev}" ]; then
              echo "::error::${dev} is a development dependency and would be shipped."
              status=1
            fi
          done

          # Hidden files are rejected by the plugin directory. Inside vendor they
          # are somebody else's .gitattributes, so they are removed rather than
          # reported: the alternative is patching six upstream packages.
          find build/oxyddt-for-woocommerce/vendor -name '.*' -not -name '.' -prune -exec rm -rf {} + || true

          hidden="$(find build/oxyddt-for-woocommerce -name '.*' -not -name '.' -print)"
          if [ -n "${hidden}" ]; then
            echo "::error::the plugin directory rejects hidden files: ${hidden}"
            status=1
          fi

          exit "${status}"

      - name: And everything users need must be
        run: |
          status=0
          for required in oxyddt-for-woocommerce.php readme.txt uninstall.php LICENSE src assets templates \
                          languages/oxyddt-for-woocommerce.pot \
                          languages/oxyddt-for-woocommerce-it_IT.mo \
                          vendor/autoload.php vendor/dompdf/dompdf; do
            if [ ! -e "build/oxyddt-for-woocommerce/${required}" ]; then
              echo "::error::${required} is missing from the package."
              status=1
            fi
          done

          exit "${status}"

      - name: Every shipped file must parse
        run: find build/oxyddt-for-woocommerce -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: oxyddt-for-woocommerce-plugin
          path: build/oxyddt-for-woocommerce
          if-no-files-found: error

  conformita:
    name: Conformita' — la versione dichiarata e' una sola
    runs-on: ubuntu-latest

    # Il `php -l` su ogni file lo fa gia' il lavoro del pacchetto, qui sopra.
    # Quello che manca e' l'altra meta': che il numero di versione sia UNO.
    steps:
      - uses: actions/checkout@v5

      # Quella dell'intestazione e' la versione che WordPress mostra e con cui
      # decide se c'e' un aggiornamento; quella del readme e' la versione che
      # wordpress.org pubblica. Due numeri diversi sono un aggiornamento che
      # non parte, e nessuno se ne accorge finche' non lo aspetta.
      - name: La versione e' la stessa nell'intestazione e nel readme
        run: |
          PLUGIN=$(grep -m1 -E '^ \* Version:' oxyddt-for-woocommerce.php \
            | sed 's/.*Version: *//' | tr -d ' \r')
          README=$(grep -m1 '^Stable tag:' readme.txt \
            | sed 's/.*Stable tag: *//' | tr -d ' \r')

          echo "intestazione: ${PLUGIN}"
          echo "readme:       ${README}"

          if [ -z "$PLUGIN" ] || [ "$PLUGIN" != "$README" ]; then
            echo "le due versioni non coincidono" >&2
            exit 1
          fi
